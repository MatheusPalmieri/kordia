[project]
name = "acompanhante"
version = "0.0.1"
description = "Kordia: baixo e pad automáticos que ouvem o violão"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "soundfile", "matplotlib", "pytest", "sounddevice"]

[tool.setuptools]
packages = ["acompanhante"]

[tool.setuptools.package-data]
acompanhante = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
